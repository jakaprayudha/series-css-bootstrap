<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Pasien Baru - SIMRS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">
   <div class="container-fluid">
      <h2 class="text-primary fw-bold">🏥 Registrasi Pasien Baru</h2>
      <div class="row">
         <div class="col-lg-4">
            <div class="card shadow-lg">
               <div class="card-body p-4">
                  <h5 class="text-secondary mb-3 fw-bold">Form Pasien Baru</h5>
                  <form action="">
                     <div class="mb-3">
                        <label for="rm" class="form-label">Nomor Rekam Medis</label>
                       <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                         <input type="number" class="form-control" id="rm" placeholder="No.Rekam Medis">
                          <span class="input-group-text"><button class="btn btn-outline-primary">Check RM</button></span>
                       </div>
                     </div>

                      <div class="mb-3">
                        <label for="rm" class="form-label">NIK</label>
                       <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-folder"></i></span>
                         <input type="number" class="form-control" id="rm" placeholder="9999999999999">
                          <span class="input-group-text"><button class="btn btn-outline-primary">Check NIK</button></span>
                       </div>
                     </div>

                     <div class="mb-3">
                        <label for="rm" class="form-label">Nama Lengkap</label>
                       <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                         <input type="text" class="form-control" id="rm" placeholder="">
                       </div>
                     </div>

                    <div class="form-floating mb-3">
                   <textarea name="" class="form-control"  id="floatingInput" style="height: 100px;"></textarea>
                     <label for="floatingInput">Alamat Sesuai Domisili</label>
                     </div>
                     <div class="mb-3">
                        <label for="rm" class="form-label">Tanggal Lahir</label>
                       <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                         <input type="date" class="form-control" id="rm" placeholder="">
                       </div>
                     </div>
                     
                     <div class="mb-3">
                        <div class="form-labe d-block">Jenis Kelamin</div>
                        <div class="d-flex gap-4">
                           <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                        <label class="form-check-label" for="radioDefault1">
                           Pria
                        </label>
                        </div>
                         <div class="form-check">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                        <label class="form-check-label" for="radioDefault1">
                           Wanita
                        </label>
                        </div>
                        </div>
                     </div>

                     <div class="mb-3">
                        <div class="form-check">
                           <input type="checkbox" class="form-check-input">
                           <label for="">BPJS AKTIF</label>
                        </div>
                     </div>

                     <div class="mb-3">
                        <label for="" class="form-label">Layanan</label>
                        <select class="form-select" id="">
                           <option value="Poli A">Poli A</option>
                           <option value="Poli B">Poli B</option>
                           <option value="Poli C">Poli C</option>
                        </select>
                        <button class="btn btn-primary mt-4 w-100"><i class="bi bi-save"></i> Simpan Data Pasien</button>
                     </div>
                  </form>
               </div>
            </div>
         </div>
         <div class="col-lg-8">
            <div class="card">
               <div class="card-body">
                 <div class="d-flex justify-content-between align-items-center mb-3">
                   <h5>Data Pasien Terdaftar</h5>
                   <div class="input-group" style="max-width: 250px;">
                     <span class="input-group-text"><i class="bi bi-search"></i></span>
                     <input type="text" class="form-control" placeholder="Cari Data">
                   </div>
                 </div>
                  <table class="table table-striped align-middle">
                     <thead class="table-primary text-center">
                        <tr>
                           <th>RM</th>
                           <th>Nama Pasien</th>
                           <th>Jenis Kelamin</th>
                           <th>Poli</th>
                           <th>Aksi</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr>
                           <td>2222</td>
                           <td>Eko</td>
                           <td>Pria</td>
                           <td>Poli A</td>
                           <td class="text-center">
                              <button class="btn btn-info"><i class="bi bi-eye"></i></button>
                              <button class="btn btn-warning"><i class="bi bi-pencil"></i></button>
                              <button class="btn btn-danger"><i class="bi bi-trash"></i></button>
                           </td>
                        </tr>
                        <tr>
                           <td>9999</td>
                           <td>Putra</td>
                           <td>Pria</td>
                           <td>Poli C</td>
                           <td class="text-center">
                              <button class="btn btn-info"><i class="bi bi-eye"></i></button>
                              <button class="btn btn-warning"><i class="bi bi-pencil"></i></button>
                              <button class="btn btn-danger"><i class="bi bi-trash"></i></button>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>
   </div>
</body>
</html>
