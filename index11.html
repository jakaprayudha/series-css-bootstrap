<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container my-4">
        <h3 class="fw-bold mb-4">🏥 Pendaftaran Pasien MCU
            <small class="d-block text-muted fs-6">Form Register Medical Checkup</small>
        </h3>

        <div id="alertarea"></div>

        <!-- <div class="alert alert-success" role="alert">
            <i class="fas fa-info-circle"></i> Data berhasil disimpan
        </div>
         <div class="alert alert-warning" role="alert">
            <i class="fas fa-exclamation-triangle"></i> Isi Formulir dengan lengkap
        </div> -->
        
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5>📝 Data Pasien</h5>
                <div class="mb-3">
                    <label for="nama_pasien" class="form-label">Nama Pasien</label>
                    <input type="text" class="form-control" id="nama_pasien" >
                </div>
                 <div class="mb-3">
                    <label for="tanggal_lahir" class="form-label">Tanggal Lahir</label>
                    <input type="date" class="form-control" id="tanggal_lahir" >
                </div>
                <button class="btn btn-primary" id="btnSimpan">
                    <span id="btnText">Simpan</span>
                    <span id="btnSpinner" class="spinner-border d-none spinner-border-sm  ms-2"></span>
                </button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="fw-bold mb-3">📌 Status Antrian</h5>
                <button class="btn btn-outline-primary">Pasien Antri
                    <span class="badge bg-primary" id="antrian">12</span>
                </button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="fw-bold mb-3">📊 Bed Occupancy</h5>
                <div class="progress">
                    <div id="occupancyBar" class="progress-bar bg-warning" style="width: 80%">80%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let antrian = 12;
        let occupancy = 80;

        document.getElementById("btnSimpan").addEventListener("click", function(){
            const nama = document.getElementById("nama_pasien").value;
            const tgl = document.getElementById("tanggal_lahir").value;

            document.getElementById("alertarea").innerHTML = "";
            if(!nama || !tgl){
                showAlert("warning", "Isi Formulir dengan lengkap");
                return;
            }
            document.getElementById("btnSpinner").classList.remove("d-none");
            document.getElementById("btnText").textContent = "Menyimpan...";
            this.disabled = true;

            setTimeout(()=>{
                document.getElementById("btnSpinner").classList.add("d-none");
                document.getElementById("btnText").textContent = "Simpan";
                this.disabled = false;

                antrian++;
                occupancy = Math.min(100, occupancy+2);

                document.getElementById("antrian").textContent = antrian;
                document.getElementById("occupancyBar").style.width = occupancy+"%";
                document.getElementById("occupancyBar").textContent = occupancy+"%";
                showAlert("success", "Data berhasil disimpan");

                document.getElementById("nama_pasien").value = "";
                document.getElementById("tanggal_lahir").value = "";
            },2000);
        });

        function showAlert(type, message){
            document.getElementById("alertarea").innerHTML = `
            <div class="alert alert-${type}" d-flex align-items-center role="alert">
               <i class="bi bi-info-circle me-2"></i> ${message}
            </div>
            `;
        }
       
    </script>
</body>
</html>
