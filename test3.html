<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Table SIMRS - Raw Data View</title>

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body { background: #eef1f5; }
    .card { border-radius: 14px; }
    table thead th {
        background: #0d6efd;
        color: white;
        text-align: center;
    }
    table tbody td {
        vertical-align: middle;
        text-align: center;
    }
</style>

</head>
<body class="p-4">

<h2 class="fw-bold mb-4">📄 Data Kunjungan & Pendapatan — Raw Table View</h2>

<div class="card shadow-sm p-3">
 <div class="d-flex justify-content-between align-content-center mb-3">
      <h5 class="fw-bold mb-3">Tabel Data Harian SIMRS</h5>
  <a href="test2.html" class="btn btn-secondary">Kembali</a>
 </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Kunjungan</th>
                    <th>Rawat Jalan</th>
                    <th>Rawat Inap</th>
                    <th>Pendapatan</th>
                    <th>IGD</th>
                    <th>Anak</th>
                    <th>Umum</th>
                    <th>Bedah</th>
                    <th>Kandungan</th>
                    <th>BOR (%)</th>
                </tr>
            </thead>
            <tbody id="tableData"></tbody>
        </table>
    </div>
</div>

<script>
/* DATA DUMMY — Sama seperti Dashboard */
const simrsData = [
    { tanggal: "2025-01-01", kunjungan: 122, pendapatan: 15400000, rj: 96, ri: 26, poli:{igd:22,anak:18,umum:40,bedah:20,kandungan:22}, bor:65 },
    { tanggal: "2025-01-02", kunjungan: 138, pendapatan: 18300000, rj: 110, ri: 28, poli:{igd:30,anak:20,umum:35,bedah:28,kandungan:25}, bor:70 },
    { tanggal: "2025-01-03", kunjungan: 95,  pendapatan: 9700000,  rj: 75, ri: 20, poli:{igd:18,anak:12,umum:40,bedah:10,kandungan:15}, bor:55 },
    { tanggal: "2025-01-04", kunjungan: 175, pendapatan: 22500000, rj: 138, ri: 37, poli:{igd:45,anak:25,umum:50,bedah:30,kandungan:25}, bor:82 },
    { tanggal: "2025-01-05", kunjungan: 130, pendapatan: 16000000, rj: 100, ri: 30, poli:{igd:28,anak:15,umum:45,bedah:20,kandungan:22}, bor:68 },
    { tanggal: "2025-01-06", kunjungan: 210, pendapatan: 26000000, rj: 158, ri: 52, poli:{igd:60,anak:30,umum:70,bedah:35,kandungan:25}, bor:90 },
    { tanggal: "2025-01-07", kunjungan: 185, pendapatan: 23000000, rj: 140, ri: 45, poli:{igd:55,anak:22,umum:65,bedah:28,kandungan:15}, bor:75 }
];

/* RENDER TABLE */
function renderTable() {
    const tbody = document.getElementById("tableData");
    tbody.innerHTML = "";

    simrsData.forEach(row => {
        tbody.innerHTML += `
            <tr>
                <td>${row.tanggal}</td>
                <td>${row.kunjungan}</td>
                <td>${row.rj}</td>
                <td>${row.ri}</td>
                <td>Rp ${row.pendapatan.toLocaleString()}</td>
                <td>${row.poli.igd}</td>
                <td>${row.poli.anak}</td>
                <td>${row.poli.umum}</td>
                <td>${row.poli.bedah}</td>
                <td>${row.poli.kandungan}</td>
                <td>${row.bor}%</td>
            </tr>
        `;
    });
}

renderTable();
</script>

</body>
</html>
