<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
   <div class="card shadow-lg p-4" style="width: 380px;">
      <h4 class="text-center mb-3 fw-bold">Buat Akun Baru</h4>
      <div class="mb-3">
         <label for="">Nama Lengkap</label>
         <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" placeholder="Masukkan Nama Lengkap">
         </div>
      </div>
      <div class="mb-3">
         <label for="">Email</label>
         <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" placeholder="Masukkan Email">
         </div>
      </div>
       <div class="mb-3">
         <label for="">Password</label>
         <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" placeholder="Minimal 6 karakter">
         </div>
      </div>
      <button class="btn btn-primary w-100">Daftar</button>
     <div class="text-center mt-3">
       <a href="login.html">Sudah Punya Akun ? Login</a>
     </div>
   </div>
</body>
</html>
